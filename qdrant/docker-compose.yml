services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    restart: always
    ports:
      - "6333:6333" # REST API & Dashboard 端口
      - "6334:6334" # gRPC 端口 (LangChain/LangGraph 推荐使用，速度更快)
    volumes:
      - ./qdrant_storage:/qdrant/storage # 挂载本地目录持久化存储数据
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=true # 确保 Dashboard 静态资源开启
